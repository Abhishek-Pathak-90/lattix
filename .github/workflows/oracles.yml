name: oracles
on: [push, pull_request]
jobs:
  oracles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: "bash -el {0}"
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment-ci.yml
          activate-environment: lattix
          auto-activate-base: false
      - name: "Bmad/Tao environment (separate env, bmad pins python 3.13)"
        run: conda env create -q -f environment-bmad.yml
      - name: MAD-X via cpymad (Linux wheels only)
        if: runner.os == 'Linux'
        run: pip install cpymad
      - name: Install lattix
        run: |
          pip install -e . --no-deps
          python -c "from lattix.oracles import available_oracles; print(available_oracles())"
      - name: Oracle-backed tests (elegant, MAD-X, xtrack, Bmad, ImpactX, IMPACT-Z)
        env:
          LATTIX_BMAD_ENV: lattix-bmad
        run: pytest -m "(oracle_madx or oracle_xtrack or oracle_bmad or oracle_elegant or oracle_impactx or oracle_impactz) and not crossval" -ra
      - name: Cross-format battery (every pair on every public deck; engine pairs where engines exist)
        env:
          LATTIX_BMAD_ENV: lattix-bmad
        run: pytest tests/crossval -m "crossval and not oracle_flame and not oracle_scibmad and not oracle_lightwin and not oracle_cheetah and not oracle_helix and not oracle_tracewin" -ra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-${{ matrix.os }}
          path: "**/*.fidelity.json"
          if-no-files-found: ignore
  lightwin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LightWin and lattix (LightWin needs python >= 3.12; runs in-process)
        run: |
          pip install lightwin
          pip install -e . pytest
          python -c "from lattix.oracles import get_oracle; print(get_oracle('lightwin').available())"
      - name: LightWin-backed tests (fingerprint, adapter, battery fallback)
        run: pytest -m "oracle_lightwin and not oracle_helix" -ra
  cheetah:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Cheetah (CPU torch) and lattix
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install cheetah-accelerator fonttools cpymad
          pip install -e . pytest
          python -c "from lattix.oracles import get_oracle; print(get_oracle('cheetah').available())"
      - name: Cheetah-backed tests (fingerprint, FODO gate vs cpymad, conventions)
        run: pytest -m "oracle_cheetah and not oracle_helix" -ra

