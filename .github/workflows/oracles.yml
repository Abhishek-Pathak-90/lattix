name: oracles
on: [push, pull_request]
jobs:
  oracles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: "bash -el {0}"
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment-ci.yml
          activate-environment: lattix
          auto-activate-base: false
      - name: "Bmad/Tao environment (separate env, bmad pins python 3.13)"
        run: conda env create -q -f environment-bmad.yml
      - name: Install lattix
        run: |
          pip install -e . --no-deps
          python -c "from lattix.oracles import available_oracles; print(available_oracles())"
      - name: Oracle-backed tests (elegant, MAD-X, xtrack, Bmad, ImpactX, IMPACT-Z)
        env:
          LATTIX_BMAD_ENV: lattix-bmad
        run: pytest -m "oracle_madx or oracle_xtrack or oracle_bmad or oracle_elegant or oracle_impactx or oracle_impactz" -ra
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity-${{ matrix.os }}
          path: "**/*.fidelity.json"
          if-no-files-found: ignore
