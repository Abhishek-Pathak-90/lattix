name: nightly
on:
  # schedule: [{ cron: "0 7 * * *" }]   # enable once the self-hosted runner (labels: macOS, lattix) is registered
  workflow_dispatch:
jobs:
  corpus:
    # self-hosted macOS runner on the development Mac: private corpus + licensed TraceWin
    runs-on: [self-hosted, macOS, lattix]
    steps:
      - uses: actions/checkout@v4
      - run: |
          source ~/anaconda3/etc/profile.d/conda.sh && conda activate lattix && pip install -e .
          python -m lattix.corpus verify --root "$LATTIX_CORPUS_DIR"
          pytest -m "corpus or oracle_tracewin or slow" -ra --hypothesis-profile=nightly
        env:
          LATTIX_CORPUS_DIR: ${{ vars.LATTIX_CORPUS_DIR }}
          TRACEWIN_EXE: ${{ vars.TRACEWIN_EXE }}
          HELIX_ROOT: ${{ vars.HELIX_ROOT }}
