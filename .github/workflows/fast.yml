name: fast
on: [push, pull_request]
jobs:
  fast:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]" pysdds "pals-schema>=0.3.0"
      # cpymad ships Linux wheels only for this Python on the hosted runners; without it the
      # MAD-X reader tests skip (MissingDependencyError -> skip) and coverage drops a few points.
      - if: runner.os == 'Linux'
        run: pip install cpymad
      - run: ruff check lattix tests
      - run: pytest -m "not corpus and not slow and not crossval and not oracle_madx and not oracle_xtrack and not oracle_bmad and not oracle_elegant and not oracle_impactx and not oracle_impactz and not oracle_flame and not oracle_scibmad and not oracle_lightwin and not oracle_cheetah and not oracle_pyorbit and not oracle_impactt and not oracle_helix and not oracle_tracewin" -ra --cov=lattix --cov-fail-under=70
