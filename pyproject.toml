[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lattix"
dynamic = ["version"]
description = "Translate accelerator lattice files between codes with a fidelity report and engine-backed validation."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Abhishek Pathak"}]
keywords = [
  "accelerator physics", "beam dynamics", "lattice", "translator",
  "TraceWin", "MAD-X", "MAD8", "Elegant", "Bmad", "PALS", "ImpactX", "IMPACT-Z", "IMPACT-T",
  "FLAME", "xtrack", "xsuite", "SciBmad", "Cheetah", "PyORBIT", "Ocelot", "DYNAC", "Synergia", "OPAL",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Environment :: Console",
]
dependencies = [
  "numpy>=1.24",
  "pydantic>=2.5",
  "lark>=1.1",
  "pyyaml>=6",
]

[project.urls]
Homepage = "https://github.com/Accel-Toolkit/lattix"
Repository = "https://github.com/Accel-Toolkit/lattix"
Issues = "https://github.com/Accel-Toolkit/lattix/issues"
Documentation = "https://github.com/Accel-Toolkit/lattix/blob/main/docs/index.md"
Changelog = "https://github.com/Accel-Toolkit/lattix/blob/main/CHANGELOG.md"

[project.optional-dependencies]
oracles = ["cpymad>=1.16", "xtrack>=0.60", "xpart>=0.20", "pysdds>=0.6"]
pals = ["pals-schema>=0.3"]
dev = ["pytest>=7", "pytest-cov", "hypothesis>=6", "ruff", "mypy", "build", "twine>=6.1", "packaging"]

[project.scripts]
lattix = "lattix.cli:main"

[tool.setuptools.packages.find]
include = ["lattix*"]

[tool.setuptools.dynamic]
version = {attr = "lattix._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "oracle_madx: needs MAD-X via cpymad",
  "oracle_xtrack: needs xtrack",
  "oracle_bmad: needs Bmad/Tao via pytao (conda env)",
  "oracle_elegant: needs the elegant binary",
  "oracle_impactx: needs impactx",
  "oracle_impactz: needs IMPACT-Z",
  "oracle_flame: needs flame-code",
  "oracle_scibmad: needs julia with SciBmad (Beamlines.jl + BeamTracking.jl)",
  "oracle_lightwin: needs LightWin (python >= 3.12, conda env `lightwin` or LATTIX_LIGHTWIN_PYTHON)",
  "oracle_cheetah: needs Cheetah + torch (conda env `cheetah` or LATTIX_CHEETAH_PYTHON)",
  "oracle_pyorbit: needs PyORBIT3 (conda env `pyorbit` or LATTIX_PYORBIT_PYTHON)",
  "oracle_impactt: needs the IMPACT-T binary (ImpactTexe; conda-forge impact-t)",
  "oracle_ocelot: needs Ocelot (env `ocelot` with ocelot-desy, or LATTIX_OCELOT_PYTHON)",
  "oracle_dynac: needs a locally built DYNAC binary (LATTIX_DYNAC_EXE); never in CI (EULA)",
  "oracle_synergia: needs a built Synergia 3 (LATTIX_SYNERGIA_PYTHON, or the clone's pixi install)",
  "oracle_helix: needs a HELIX checkout (HELIX_ROOT)",
  "oracle_tracewin: needs a licensed TraceWin binary (TRACEWIN_EXE); local only",
  "corpus: needs LATTIX_CORPUS_DIR with the private corpus manifest",
  "slow: long-running",
  "crossval: cross-format battery (tests/crossval)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["tests/golden"]   # generated decks (ImpactX python flavour) are not source
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.setuptools.package-data]
lattix = ["py.typed", "oracles/data/*", "oracles/*.jl", "ui/static/*"]
