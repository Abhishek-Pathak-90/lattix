# Pointer file for the PRIVATE lattix corpus on this machine (PLAN.md section 5.4).
#
# Nothing listed here enters the repository: `python -m lattix.corpus build-manifest
# --sources corpus/sources.yaml` walks these absolute paths and writes
# $LATTIX_CORPUS_DIR/manifest.yaml (sha256, size, sniffed format, provenance) outside
# the repo.  Patterns are relative to each source's `root`; `{a,b}` brace expansion and
# `**` globs are allowed; a directory means "every file below it".  `formats:` keeps only
# files that sniff as one of the listed formats; `format:` overrides the sniff.
#
# Redistributable public samples live in tests/data/public/ instead (see its README).
version: 1
sources:
  - name: pipii-tracewin
    root: /Users/abhishekpathak/Desktop/Projects/PIP_II/Paper
    paths:
      - "**/*.dat"
    formats: [tracewin]          # the tree also holds TraceWin outputs (Transfer_matrix1.dat,
                                 # binary Density_*.dat, ...) which are filtered out here
    origin: "PIP-II design decks (Fermilab)"
    license: private
    redistributable: false
    notes: >-
      PIP-II SC linac / MEBT / BTL / BAL TraceWin decks from the design and beam-dynamics
      study trees (FDR_Design, optimized_datfiles, lboptimization calculations, ...).

  - name: pipii-anchors
    root: /Users/abhishekpathak/Desktop/Projects/PIP_II/Paper/Lattice_Design_and_Beam_dynamics
    paths:
      - "Studies_and_Related_Material/Beam_Dynamics_Studies/BTL/BTL_Lattice_with_Spacecharge/MAD_lattice/{BTL2022V0922_NEWCOL.FLAT,elegant_lattice.lte}"
      - "Studies_and_Related_Material/Beam_Dynamics_Studies/BAL/BAL_Lattice_with_Spacecharge/MAD_lattice/{BTL2022V0922_NEWCOL.FLAT,elegant_lattice.lte}"
      - "Studies_and_Related_Material/Virtual Accelerator/Prototypes/V1_14_August_2024/TraceWin_elegant_lattice.lte"
      - "TraceWin_lattice/*.lat"
    origin: "PIP-II design decks (Fermilab)"
    license: private
    redistributable: false
    notes: >-
      Multi-format lockstep anchors: BTL MAD8 flat file and its Elegant translation, the HWR
      cryomodule Elegant deck, and the TraceWin_lattice/*_Lat.lat + hb650_sad.lat decks, which
      are TraceWin dialect despite the .lat suffix (the sniffer decides by content).

  - name: helix-examples
    root: /Users/abhishekpathak/Desktop/Projects/HELIX_unzipped/HELIX_v3
    paths:
      - "examples/**/*.dat"
      - "examples/madx/*.madx"
    origin: "HELIX (Abhishek Pathak)"
    license: "GPL-3.0 / owner"
    redistributable: true
    notes: HELIX example decks (TraceWin dialect) and the two MAD-X import demos.

  - name: helix-pipii-root
    root: /Users/abhishekpathak/Desktop/Projects/HELIX_unzipped/HELIX_v3
    paths:
      - BTL2025v0703.lat
      - BAL2025V0213.FLAT
    origin: "HELIX (Abhishek Pathak)"
    license: "GPL-3.0 / owner"
    redistributable: false
    notes: PIP-II BTL/BAL MAD8 flat files kept at the HELIX repo root (Fermilab design data).

  - name: fieldmaps
    root: /Users/abhishekpathak/Desktop/Projects/HELIX_unzipped/HELIX_v3
    paths:
      - "Fields/*"
    format: fieldmap
    origin: "ANL/CEA"
    license: private
    redistributable: false
    notes: TraceWin ASCII field maps (HWR/SSR/650 cavities, PXIE solenoids, RFQ vane) used by the PIP-II decks.

  - name: tracewin-ground-truth
    root: /Users/abhishekpathak/Desktop/Projects/HELIX_unzipped
    paths:
      - "HELIX_v3/Tracewin_code/**/*"
      - "TraceWIn_Tools/{Transfer_matrix1.dat,Individual_matrix.dat,BTL_lattice.dat}"
    origin: "CEA TraceWin outputs"
    license: private
    redistributable: false
    notes: >-
      TraceWin envelope / multiparticle exports and transfer-matrix dumps used as oracle ground
      truth; BTL_lattice.dat is the deck those matrices were computed from.

  - name: booster
    root: /Users/abhishekpathak/Desktop/Projects/ring_code/MAD-X_BOOSTER
    paths:
      - "**/*.{madx,seq,dat}"
    origin: "FNAL Booster MAD-X"
    license: private
    redistributable: false
    notes: FNAL Booster MAD-X sequence/scripts (NEW and OLD) with their TFS magnet tables (*.dat).
