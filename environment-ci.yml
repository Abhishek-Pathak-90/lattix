# CI / oracle environment for lattix (everything except Bmad, which needs its own env).
# cpymad and xtrack are PyPI-only -> pip section. (lightwin needs py>=3.12: not included.)
name: lattix
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - pydantic>=2.5
  - lark
  - pyyaml
  - pytest
  - pytest-cov
  - hypothesis
  - elegant=2026.3.0
  - impactx=26.08
  - impact-z=2.7.7
  - impact-t=3.1.5
  - gsl=2.7          # elegant links libgsl.25
  - pip
  - pip:
      # cpymad has no macOS arm64 wheel: the workflows pip-install it on Linux only
      - xtrack
      - xpart
      - pysdds
      - pals-schema>=0.3.0
