PALS:
  version: null
  notes:
  - written by lattix <version> from the lattix IR
  facility:
  - drift1:
      kind: Drift
      length: 0.25
  - quad1:
      kind: Quadrupole
      length: 1.0
      MagneticMultipoleP:
        Bn1: 1.0
  - drift2:
      kind: Drift
      length: 0.5
  - quad2:
      kind: Quadrupole
      length: 1.0
      MagneticMultipoleP:
        Bn1: -1.0
